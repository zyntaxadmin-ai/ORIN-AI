name: Android APK

# Builds Orin as an installable Android app (APK) and puts it in GitHub Releases.
# Runs when you push the android-app branch, when you push a tag like v1.0.0, or by hand
# (Actions tab -> Android APK -> Run workflow, once this file is on the main branch).
on:
  workflow_dispatch:
  push:
    branches: [android-app]
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check the web app
        run: node scripts/check.js

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Bundle the web files
        run: node scripts/build-www.js

      - name: Create the Android project
        run: npx cap add android

      - name: Install ImageMagick (for the app icon)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Permissions, version, icon
        run: |
          set -e
          M=android/app/src/main/AndroidManifest.xml
          # microphone for voice input, and let the app see Android's speech service
          python3 - "$M" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          if 'RECORD_AUDIO' not in s:
              s = s.replace('</manifest>', '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n</manifest>')
          if 'RecognitionService' not in s:
              s = s.replace('</manifest>', '    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n</manifest>')
          open(p, 'w', encoding='utf-8').write(s)
          PY
          # every build gets a higher version number so a new APK installs over the old one
          VN="${GITHUB_REF_NAME}"
          case "$VN" in v*) VN="${VN#v}" ;; *) VN="1.0.${{ github.run_number }}" ;; esac
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VN\"/" android/app/build.gradle
          # launcher icon from icon-512.png on the ink colour
          R=android/app/src/main/res
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#0d1230</color></resources>' > $R/values/ic_launcher_background.xml
          for d in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $d
            convert icon-512.png -resize ${2}x${2} $R/mipmap-$1/ic_launcher.png
            convert icon-512.png -resize ${2}x${2} $R/mipmap-$1/ic_launcher_round.png
            S=$(( $3 * 62 / 100 ))
            convert icon-512.png -resize ${S}x${S} -background none -gravity center -extent ${3}x${3} $R/mipmap-$1/ic_launcher_foreground.png
          done

      - name: Sync web files into the app
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign the APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          # Own key from repository secrets if you added them, otherwise the key in android-signing/.
          # Either way the key stays the same between builds, which is what lets a new APK update the old app.
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/orin.jks"
            KS="$RUNNER_TEMP/orin.jks"; PASS="$KS_PASS_SECRET"; ALIAS="${KS_ALIAS_SECRET:-orin}"
          else
            KS="android-signing/orin.jks"; PASS="orin-personal"; ALIAS="orin"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias "$ALIAS" --out Orin.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs Orin.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: Orin-apk
          path: Orin.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in v*) TAG="$GITHUB_REF_NAME" ;; *) TAG="build-${{ github.run_number }}" ;; esac
          gh release create "$TAG" Orin.apk --target "$GITHUB_SHA" --title "Orin $TAG" \
            --notes "Android app. Download Orin.apk on your phone and open it. If Android asks, allow installing from this source. A newer APK installs over the old one and keeps your data."
