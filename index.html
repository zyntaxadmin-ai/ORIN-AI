<style>

*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Bengali',sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}

.rc{display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.th{display:block;max-width:100%;max-height:220px;border-radius:12px;margin-bottom:6px}

.pc{flex:none;border:1px solid var(--line);border-radius:12px;padding:4px 4px 4px 6px;display:flex;align-items:center;gap:6px;font-size:13px;max-width:190px}
.pc img{width:38px;height:38px;object-fit:cover;border-radius:8px}
.pc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.m p{margin:0 0 .45em}.m p:last-child{margin:0}
.m h3,.m h4,.m h5,.m h6{margin:.7em 0 .3em;line-height:1.3;font-size:1.02em}.m h3{font-size:1.15em}

.tw{overflow-x:auto;margin:.5em 0}.m table{border-collapse:collapse;font-size:14px}
.m th,.m td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top;overflow-wrap:normal}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>

<script>
const PRESETS=[
 ['OpenRouter','openai','https://openrouter.ai/api/v1'],
 ['Groq','openai','https://api.groq.com/openai/v1'],
 ['DeepSeek','openai','https://api.deepseek.com/v1'],
 ['Together','openai','https://api.together.xyz/v1'],
 ['OpenAI','openai','https://api.openai.com/v1'],
 ['Anthropic','anthropic','https://api.anthropic.com'],
 ['Gemini','gemini','https://generativelanguage.googleapis.com']];
const KEY='my-ai-v1';
const strip=(k,v)=>k==='imgs'?undefined:v;
let S={providers:[],chats:[],cur:null,system:'',theme:'light'};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(S.theme==='auto'&&!S.t2){S.theme='light';S.t2=1}
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function rawSave(){try{localStorage.setItem(KEY,JSON.stringify(S,strip))}catch(e){}}
function save(){S.ts=Date.now();rawSave();schedPush()}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
function inl(t){return t.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<i>$2</i>').replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function tbl(rows){
  const R=rows.map(r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
  const sep=R[1]&&R[1].every(c=>/^:?-{1,}:?$/.test(c));
  const head=sep?R[0]:null,body=sep?R.slice(2):R;
  return '<div class="tw"><table>'+(head?'<thead><tr>'+head.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead>':'')+'<tbody>'+body.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}
function md(t){
  return esc(t).split('```').map((p,i)=>{
    if(i%2)return '<pre><code>'+p.replace(/^[\w-]*\n/,'')+'</code></pre>';
    let h='',list=null,tb=[];
    const eL=()=>{if(list){h+='</'+list+'>';list=null}};
    const eT=()=>{if(tb.length){h+=tbl(tb);tb=[]}};
    for(const ln of p.split('\n')){
      let m;
      if(/^\s*\|.*\|\s*$/.test(ln)){eL();tb.push(ln);continue}
      eT();
      if(m=ln.match(/^(#{1,6})\s+(.*)$/)){eL();const n=m[1].length<=3?3:4;h+='<h'+n+'>'+inl(m[2])+'</h'+n+'>'}
      else if(/^\s*(-{3,}|\*{3,})\s*$/.test(ln)){eL();h+='<hr>'}
      else if(m=ln.match(/^\s*[*+-]\s+(.*)$/)){if(list!=='ul'){eL();h+='<ul>';list='ul'}h+='<li>'+inl(m[1])+'</li>'}
      else if(m=ln.match(/^\s*\d+[.)]\s+(.*)$/)){if(list!=='ol'){eL();h+='<ol>';list='ol'}h+='<li>'+inl(m[1])+'</li>'}
      else if(m=ln.match(/^&gt;\s?(.*)$/)){eL();h+='<blockquote>'+inl(m[1])+'</blockquote>'}
      else if(!ln.trim()){eL();h+='<div class="sp"></div>'}
      else{eL();h+='<p>'+inl(ln)+'</p>'}
    }
    eL();eT();return h;
  }).join('');
}
function applyTheme(){if(S.theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=S.theme}
function chat(){return S.chats.find(c=>c.id===S.cur)}
function newChat(){const c={id:uid(),title:'New chat',msgs:[]};S.chats.unshift(c);S.cur=c.id;home=false;save();closeDrawer();render();$('box').focus()}


/* ---------- Cloud sync (Supabase) ---------- */
let cst='',syncing=false,pt=0;
const C=()=>S.cloud||{};
async function sb(path,opt={},auth=true){
  const c=C();const h=Object.assign({apikey:c.anon,'Content-Type':'application/json'},opt.headers||{});
  if(auth){await refreshTok();h.Authorization='Bearer '+C().session.at}
  const r=await fetch(c.url.replace(/\/+$/,'')+path,Object.assign({},opt,{headers:h}));
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((j&&(j.msg||j.message||j.error_description||j.error))||r.status);
  return j;
}
function setSession(j){S.cloud.session={at:j.access_token,rt:j.refresh_token,exp:Math.floor(Date.now()/1000)+(j.expires_in||3600),uid:j.user.id};rawSave()}
async function refreshTok(){
  const c=C();if(!c.session)throw new Error('Not logged in');
  if(c.session.exp-60>Date.now()/1000)return;
  setSession(await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:c.session.rt})},false));
}
async function push(){
  const d={providers:S.providers,chats:S.chats,system:S.system,theme:S.theme,search:S.search,imgcfg:S.imgcfg,ts:S.ts||Date.now()};
  await sb('/rest/v1/orin_data?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:C().session.uid,data:d,updated_at:new Date().toISOString()},strip)});
  cst='synced '+new Date().toLocaleTimeString();
}
function schedPush(){if(!C().session)return;clearTimeout(pt);pt=setTimeout(()=>push().catch(e=>{cst='error: '+e.message}),1500)}
function applyRemote(rd){
  S.providers=rd.providers||[];S.chats=rd.chats||[];S.system=rd.system||'';S.theme=rd.theme||'auto';S.search=rd.search||S.search;S.imgcfg=rd.imgcfg||S.imgcfg;S.ts=rd.ts||0;
  if(!chat())S.cur=S.chats[0]?S.chats[0].id:null;
  rawSave();applyTheme();render();
}
async function syncNow(first){
  if(!C().session||syncing||busy)return;syncing=true;
  try{
    const rows=await sb('/rest/v1/orin_data?select=data');
    const rd=rows&&rows[0]&&rows[0].data;
    if(!rd)await push();
    else if(first){
      if(!S.providers.length||confirm('Cloud e data ache. OK = ei device er data replace hobe. Cancel = ei device er data cloud e jabe.'))applyRemote(rd);else await push();
      cst='synced '+new Date().toLocaleTimeString();
    }else if((rd.ts||0)>(S.ts||0)){applyRemote(rd);cst='synced '+new Date().toLocaleTimeString()}
    else if((rd.ts||0)<(S.ts||0))await push();
    else cst='synced '+new Date().toLocaleTimeString();
  }catch(e){cst='error: '+e.message}
  syncing=false;
}

function cv(p,m){
  const im=m.imgs&&m.imgs.length?m.imgs:null,pdf=i=>i.mime==='application/pdf';
  const tx=m.content||(im?(im.some(pdf)?'Summarize this document.':'Describe this image.'):' ');
  if(p.type==='gemini')return{role:m.role==='assistant'?'model':'user',parts:(im||[]).map(i=>({inlineData:{mimeType:i.mime,data:i.data}})).concat([{text:tx}])};
  if(!im)return{role:m.role,content:m.content};
  if(p.type==='anthropic')return{role:m.role,content:im.map(i=>pdf(i)?{type:'document',source:{type:'base64',media_type:i.mime,data:i.data}}:{type:'image',source:{type:'base64',media_type:i.mime,data:i.data}}).concat([{type:'text',text:tx}])};
  return{role:m.role,content:[{type:'text',text:tx}].concat(im.map(i=>pdf(i)?{type:'file',file:{filename:i.name||'file.pdf',file_data:'data:application/pdf;base64,'+i.data}}:{type:'image_url',image_url:{url:'data:'+i.mime+';base64,'+i.data}}))};
}
async function callProvider(p,history,onDelta){
  const ctl=new AbortController();curCtl=ctl;let to=setTimeout(()=>ctl.abort(),60000);
  const sys=S.system.trim();const base=p.url.replace(/\/+$/,'');
  try{
    let url,headers={'Content-Type':'application/json'},body;
    if(p.type==='anthropic'){
      url=base+'/v1/messages';headers['x-api-key']=p.key;headers['anthropic-version']='2023-06-01';headers['anthropic-dangerous-direct-browser-access']='true';
      body={model:p.model,max_tokens:4096,stream:true,messages:history.map(m=>cv(p,m))};if(sys)body.system=sys;
    }else if(p.type==='gemini'){
      url=base+'/v1beta/models/'+encodeURIComponent(p.model.trim().replace(/^models\//,'').replace(/\s+/g,'-').toLowerCase())+':streamGenerateContent?alt=sse&key='+encodeURIComponent(p.key);
      body={contents:history.map(m=>cv(p,m))};
      if(sys)body.systemInstruction={parts:[{text:sys}]};
    }else{
      url=base+'/chat/completions';if(p.key)headers.Authorization='Bearer '+p.key;
      body={model:p.model,stream:true,messages:(sys?[{role:'system',content:sys}]:[]).concat(history.map(m=>cv(p,m)))};
    }
    const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body),signal:ctl.signal});
    if(!r.ok){const j=await r.json().catch(()=>({}));const e=Array.isArray(j)?j[0]:j;throw new Error((e&&e.error&&(e.error.message||e.error))||r.status+' '+r.statusText)}
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='',out='';
    for(;;){
      clearTimeout(to);to=setTimeout(()=>ctl.abort(),60000);
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const ln of lines){
        if(!ln.startsWith('data:'))continue;
        const d=ln.slice(5).trim();if(!d||d==='[DONE]')continue;
        let j;try{j=JSON.parse(d)}catch(_){continue}
        if(j.error)throw new Error(j.error.message||JSON.stringify(j.error));
        const t=p.type==='anthropic'?(j.type==='content_block_delta'?j.delta&&j.delta.text:''):
          p.type==='gemini'?((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(x=>x.text||'').join(''):
          j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
        if(t){out+=t;onDelta(out)}
      }
    }
    if(!out)throw new Error('Empty reply');
    return out;
  }catch(e){
    if(e.name==='AbortError')throw new Error(stopped?'STOP':'Timeout (60s)');
    if(e instanceof TypeError)throw new Error('Network/CORS block');
    throw e;
  }finally{clearTimeout(to)}
}

/* ---------- Render ---------- */
function render(typing){
  const c=chat();
  updatePill();
  $('form').style.display=home?'none':'';
  if(home){$('title').textContent='Orin';$('msgs').innerHTML=homeHTML();return}$('title').textContent=c?c.title:'Orin';
  const el=$('msgs');
  if(!c||!c.msgs.length&&!typing){
    el.innerHTML='<div class="empty"><h2>Ki jante chao?</h2><p>'+(S.providers.length?'Prothom provider fail korle porer ta te auto cole jabe.':'Shuru korar age ⚙ Settings e akta provider add koro.')+'</p></div>';return}
  let h='';
  const from=Math.max(0,c.msgs.length-60);c.msgs.forEach((m,i)=>{if(i<from)return;
    if(m.role==='user')h+='<div class="m u">'+(m.imgs?m.imgs.map(x=>x.mime==='application/pdf'?'<span class="tag">📕 '+esc(x.name||'PDF')+'</span>':'<img class="th" src="data:'+x.mime+';base64,'+x.data+'">').join(''):(m.atts||[]).map(a=>'<span class="tag">'+(a.pdf?'📕 ':'🖼 ')+esc(a.name)+'</span>').join(''))+(m.files||[]).map(f=>'<span class="tag">📄 '+esc(f.name)+'</span>').join('')+(m.content?esc(m.content).replace(/\n/g,'<br>'):'')+'</div><div class="meta r"><button data-edit="'+i+'">Edit</button></div>';
    else if(m.role==='assistant'){
      h+='<div class="m a">'+(m.pic?'<img class="gi" alt="" src="'+qa(m.pic)+'">':md(m.content))+'</div>'+srcHTML(m.src)+'<div class="meta"><span>'+esc(m.by||'')+(m.skipped&&m.skipped.length?' (fallback)':'')+'</span>'+(m.pic?'<button data-save="'+i+'">Save</button>':'<button data-copy="'+i+'">Copy</button>')+(i===c.msgs.length-1?'<button data-regen="1">Regenerate</button>':'')+'</div>';
    }else h+='<div class="m e">'+esc(m.content).replace(/\n/g,'<br>')+'</div>'+(i===c.msgs.length-1?'<div class="meta"><button data-regen="1">Retry</button></div>':'');
  });
  if(typing||busy)h+='<div class="m a" id="liveb">'+(live?md(live):'<div class="dots"><span></span><span></span><span></span></div>')+'</div>';
  el.innerHTML=h;el.scrollTop=el.scrollHeight;
}
let q='';
function renderList(){
  const l=S.chats.filter(c=>!q||c.title.toLowerCase().includes(q)||c.msgs.some(m=>(m.content||'').toLowerCase().includes(q)));
  const o=l.filter(c=>c.pin).concat(l.filter(c=>!c.pin));
  $('clist').innerHTML=o.map(c=>'<div class="ci '+(c.id===S.cur?'cur':'')+'"><button class="t" data-open="'+c.id+'">'+(c.pin?'📌 ':'')+esc(c.title)+'</button><button class="x" data-more="'+c.id+'" aria-label="Options">⋯</button></div>').join('')||'<p class="empty">Kono chat nai</p>';
}
function openDrawer(){renderList();$('drawer').classList.add('on');$('ov').classList.add('on')}
function closeDrawer(){$('drawer').classList.remove('on');$('ov').classList.remove('on')}

/* ---------- Settings ---------- */
let editing=null;
function openSheet(){drawSheet();$('sheet').classList.add('on')}
function drawSheet(){
  const b=$('sbody');
  if(editing){
    const p=editing;
    b.innerHTML='<div class="sec"><h3>'+(p._new?'Add provider':'Edit provider')+'</h3>'+
    (p._new?'<label>Quick fill</label><div class="chips">'+PRESETS.map((x,i)=>'<button type="button" class="chip" data-preset="'+i+'">'+x[0]+'</button>').join('')+'</div>':'')+
    '<label>Name</label><input class="f" id="pn" value="'+esc(p.name||'')+'">'+
    '<label>Format</label><select class="f" id="pt"><option value="openai">OpenAI-compatible (most providers)</option><option value="anthropic">Anthropic</option><option value="gemini">Gemini</option></select>'+
    '<label>Base URL</label><input class="f" id="pu" value="'+esc(p.url||'')+'" placeholder="https://…/v1">'+
    '<label>API key</label><input class="f" id="pk" type="password" value="'+esc(p.key||'')+'" autocomplete="off">'+
    '<label>Model name</label><input class="f" id="pm" value="'+esc(p.model||'')+'" placeholder="e.g. llama-3.3-70b-versatile">'+
    '<div class="row"><button class="btn" data-act="psave">Save</button><button class="btn ghost" data-act="pcancel">Cancel</button></div></div>';
    $('pt').value=p.type||'openai';return;
  }
  b.innerHTML='<div class="sec"><h3>Providers</h3><p class="h">Upor theke nichey order e try hobe. Fail korle porer ta.</p>'+
   (S.providers.map((p,i)=>'<div class="pr '+(p.on?'':'off')+'"><span class="rk">'+(i+1)+'</span><div class="n"><b>'+esc(p.name)+'</b><small>'+esc(p.model)+'</small></div>'+
   '<button class="sm-ib" data-up="'+i+'" aria-label="Move up">▲</button><button class="sm-ib" data-dn="'+i+'" aria-label="Move down">▼</button>'+
   '<button class="sm-ib" data-tg="'+i+'" aria-label="Toggle">'+(p.on?'●':'○')+'</button><button class="sm-ib" data-ed="'+i+'" aria-label="Edit">✎</button><button class="sm-ib" data-rm="'+i+'" aria-label="Delete">✕</button></div>').join('')||'<p class="h">Kono provider nai.</p>')+
   '<div class="row"><button class="btn" data-act="padd">+ Add provider</button></div></div>'+
   '<div class="sec"><h3>System prompt</h3><p class="h">Prothom e AI ke ki bole dibe (optional).</p><textarea class="f" id="sp" rows="3">'+esc(S.system)+'</textarea></div>'+
   '<div class="sec"><h3>Theme</h3><div class="row" style="margin-top:6px">'+['auto','light','dark'].map(t=>'<button class="btn '+(S.theme===t?'':'ghost')+' sm" data-theme="'+t+'">'+t+'</button>').join('')+'</div></div>'+
   webHTML()+imgHTML()+voiceHTML()+cloudHTML()+'<div class="sec"><h3>Backup</h3><p class="h">Provider, key ar chat ekta file e save kore onno device e import korte paro.</p><div class="row" style="margin-top:0"><button class="btn ghost sm" data-act="exp">Export</button><button class="btn ghost sm" data-act="imp">Import</button></div>'+
   '<p class="h" style="margin-top:10px">API key shudhu ei browser e save thake. Backup file onno kauke dio na.</p></div>';
  const sp=$('sp');if(sp)sp.oninput=()=>{S.system=sp.value;save()};
  const tk=$('tk');if(tk)tk.oninput=()=>{S.search={key:tk.value.trim()};save()};
  ['iu','ik','im','is'].forEach((id,n)=>{const e=$(id);if(e)e.oninput=()=>{S.imgcfg=Object.assign({},S.imgcfg,{[['url','key','model','size'][n]]:e.value.trim()});save()}});
}
function readForm(){return{name:$('pn').value.trim(),type:$('pt').value,url:$('pu').value.trim(),key:$('pk').value.trim(),model:$('pm').value.trim()}}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.open){S.cur=d.open;home=false;save();closeDrawer();render()}
  else if(d.del){closePop();S.chats=S.chats.filter(c=>c.id!==d.del);if(S.cur===d.del)S.cur=S.chats[0]?.id||null;save();renderList();render()}
  else if(d.rmp!==undefined){pend.splice(+d.rmp,1);renderTray()}
  else if(d.add){closePop();$(d.add).click()}
  else if(d.pk!==undefined){S.pick=d.pk==='auto'?null:d.pk;rawSave();closePop();updatePill()}
  else if(d.lang){S.lang=d.lang;rawSave();drawSheet()}
  else if(d.ipre!==undefined){const x=IMGP[+d.ipre];S.imgcfg=Object.assign({},S.imgcfg,{url:x[1],model:x[2],size:x[3]});save();drawSheet()}
  else if(d.save){const m=chat().msgs[+d.save];if(m&&m.pic){const a=document.createElement('a');a.href=m.pic;a.download='orin-image.jpg';a.target='_blank';a.rel='noopener';a.click()}}
  else if(d.more){const c=S.chats.find(x=>x.id===d.more);pop(t,'<button class="pi" data-pin="'+d.more+'"><span>📌 '+(c&&c.pin?'Unpin':'Pin')+'</span></button><button class="pi" data-ren="'+d.more+'"><span>✎ Rename</span></button><button class="pi" data-del="'+d.more+'"><span>🗑 Delete</span></button>')}
  else if(d.pin){closePop();const c=S.chats.find(x=>x.id===d.pin);if(c){c.pin=!c.pin;save();renderList()}}
  else if(d.ren){closePop();const c=S.chats.find(x=>x.id===d.ren);const n=c&&prompt('Chat er naam',c.title);if(n&&n.trim()){c.title=n.trim().slice(0,60);save();renderList();render()}}
  else if(d.regen)regen()
  else if(d.edit!==undefined)editMsg(+d.edit)
  else if(d.copy){navigator.clipboard?.writeText(chat().msgs[+d.copy].content).then(()=>toast('Copied'))}
  else if(d.preset){const x=PRESETS[+d.preset];editing=Object.assign(readForm(),{_new:true,name:x[0],type:x[1],url:x[2]});drawSheet()}
  else if(d.up!==undefined||d.dn!==undefined){const i=+(d.up??d.dn),j=d.up!==undefined?i-1:i+1;if(S.providers[j]){[S.providers[i],S.providers[j]]=[S.providers[j],S.providers[i]];save();drawSheet()}}
  else if(d.tg){S.providers[+d.tg].on=!S.providers[+d.tg].on;save();drawSheet()}
  else if(d.ed){editing=Object.assign({},S.providers[+d.ed],{_idx:+d.ed});drawSheet()}
  else if(d.rm){if(confirm('Delete this provider?')){S.providers.splice(+d.rm,1);save();drawSheet()}}
  else if(d.theme){S.theme=d.theme;save();applyTheme();drawSheet()}
  else if(d.act==='padd'){editing={_new:true,type:'openai'};drawSheet()}
  else if(d.act==='pcancel'){editing=null;drawSheet()}
  else if(d.act==='psave'){const f=readForm();if(!f.name||!f.url||!f.model){toast('Name, URL ar model dorkar');return}
    if(editing._new)S.providers.push(Object.assign({id:uid(),on:true},f));else Object.assign(S.providers[editing._idx],f);
    editing=null;save();drawSheet();toast('Saved')}
  else if(d.act==='csync')syncNow().then(drawSheet)
  else if(d.act==='cout')logout()
  else if(d.act==='hnew')newChat()
  else if(d.act==='hset'){editing=null;openSheet()}
  else if(d.act==='exp'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(Object.assign({},S,{cloud:undefined}),strip)],{type:'application/json'}));a.download='orin-backup.json';a.click()}
  else if(d.act==='imp'){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>i.files[0].text().then(x=>{try{S=Object.assign(S,JSON.parse(x));save();applyTheme();drawSheet();render();toast('Imported')}catch(_){toast('Invalid file')}});i.click()}
});
['fi','fimg','fcam'].forEach(id=>{$(id).onchange=e=>{addFiles([...e.target.files]);e.target.value=''}});
$('plus').onclick=e=>pop(e.currentTarget,'<button class="pi" data-add="fimg"><span>🖼 Photos</span></button><button class="pi" data-add="fcam"><span>📷 Camera</span></button><button class="pi" data-add="fi"><span>📄 Files</span></button>');
$('modelb').onclick=e=>pop(e.currentTarget,modelMenu());
$('mic').onclick=toggleMic;
$('webb').onclick=()=>{S.web=!S.web;rawSave();updateModes();toast(S.web?(S.search&&S.search.key?'Web search ON':'Web search ON. Settings e Tavily key dao'):'Web search OFF')};
$('imgb').onclick=()=>{imgMode=!imgMode;updateModes();toast(imgMode?(imgReady()?'Image mode ON':'Image mode ON. Settings e image provider dao'):'Image mode OFF')};
$('cq').oninput=e=>{q=e.target.value.toLowerCase();renderList()};
$('menu').onclick=openDrawer;$('homeb').onclick=()=>{home=true;closeDrawer();render()};$('aswitch').onclick=()=>setMode(amode==='in'?'up':'in');$('abtn').onclick=authGo;$('ov').onclick=closeDrawer;
$('newc').onclick=$('newc2').onclick=newChat;
$('gear').onclick=()=>{editing=null;openSheet()};
$('back').onclick=()=>{if(editing){editing=null;drawSheet()}else{$('sheet').classList.remove('on');updatePill()}};
$('form').onsubmit=e=>{e.preventDefault();if(busy){stopped=true;if(curCtl)curCtl.abort()}else send()};
$('box').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>700){e.preventDefault();send()}});
let tr=0;$('box').addEventListener('input',e=>{if(tr)return;tr=requestAnimationFrame(()=>{tr=0;const b=e.target;b.style.height='auto';b.style.height=Math.min(b.scrollHeight,140)+'px'})});
applyTheme();render();updateModes();
setMode('in');
if(!C().session)showAuth(true);else syncNow(false);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow(false)});
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
</script>
</body>
</html>
