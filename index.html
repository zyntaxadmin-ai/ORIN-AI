<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*; media-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*; frame-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orin</title>
<meta name="application-name" content="Orin">
<meta name="apple-mobile-web-app-title" content="Orin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080b1c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%232f4dff'/%3E%3Ccircle cx='32' cy='33' r='12' fill='none' stroke='white' stroke-width='6'/%3E%3Ccircle cx='48' cy='14' r='4.5' fill='%23ffb224'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/inter-Regular.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/poppins-Bold.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header>
    <button class="ib" id="menu" aria-label="Chats"></button>
    <h1 id="title">Orin</h1>
    <button class="ib" id="newc" aria-label="New chat"></button>
    <button class="ib" id="gear" aria-label="Settings"></button>
  </header>
  <div id="msgs"></div>
  <div id="rchip"></div>
  <div id="tray"></div>
  <form class="in" id="form">
    <div class="comp">
      <div id="mchips" class="mchips"></div>
      <textarea id="box" rows="1" placeholder="Message Orin…" aria-label="Message"></textarea>
      <div class="bar">
        <button type="button" class="cb" id="plus" aria-label="Add">+</button>
        <button type="button" class="pill" id="modelb">Auto ▾</button>
        <button type="button" class="pill" id="skb" aria-label="Skills"></button>
        <span class="sp1"></span>
        <button type="button" class="cb" id="mic" aria-label="Voice input"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button class="send" id="sendb" aria-label="Send">↑</button>
      </div>
    </div>
  </form>
  <button class="tobot" id="tobot" aria-label="Scroll to bottom"></button>
  <input type="file" id="fi" multiple hidden accept="application/pdf,.pdf,.zip,.docx,.xlsx,.pptx,text/*,.md,.csv,.json,.js,.ts,.py,.html,.css,.xml,.yaml,.yml,.log,.java,.c,.cpp,.sh,.sql,image/*">
  <input type="file" id="fdir" multiple hidden webkitdirectory>
  <input type="file" id="fimg" multiple hidden accept="image/*">
  <input type="file" id="fcam" hidden accept="image/*" capture="environment">
</div>

<div class="ov" id="ov"></div>
<aside class="drawer" id="drawer">
  <div class="dh"><button class="brand" id="homeb" aria-label="Home"><i></i>Orin</button><button class="ib" id="dclose" aria-label="Close"></button></div>
  <nav class="dnav"><button id="dchats" type="button"></button><button id="dset" type="button"></button></nav>
  <input class="f" id="cq" type="search" placeholder="Search chats" aria-label="Search chats"><div class="gl rc">Recents</div><div class="list" id="clist"></div>
  <div class="dfoot"><button class="dav" id="dav" type="button" aria-label="Settings">o</button><button class="btn" id="newc2" type="button">+ New chat</button></div>
</aside>

<section class="pv" id="pv"><div class="pvh"><button class="ib" id="pvx" aria-label="Close"></button><b id="pvt">Preview</b><span style="flex:1"></span><button class="chip" id="pvd">Phone</button><button class="chip" id="pvr">Reload</button></div><div class="pvw"><iframe id="pvf" sandbox="allow-scripts allow-forms allow-modals allow-popups" title="preview"></iframe></div><div class="pve" id="pve"></div></section>
<section class="sheet" id="sheet">
  <header><button class="ib" id="back" aria-label="Back">←</button><h1>Settings</h1></header>
  <div class="body" id="sbody"></div>
</section>
<div class="auth" id="auth"><div class="card"><div class="logo"><i></i></div><h1>Orin</h1><p>Log in to sync your chats and providers across devices</p>
<input class="f" id="ae" type="email" placeholder="Email" autocomplete="email">
<input class="f" id="ap" type="password" placeholder="Password" autocomplete="current-password">
<div id="adv" style="display:none"><input class="f" id="au" placeholder="Supabase URL"><input class="f" id="ak" placeholder="Publishable key"></div>
<div class="err" id="aerr"></div>
<button class="btn" id="abtn">Log in</button>
<div class="swm"><span id="aq">New to Orin?</span> <button id="aswitch">Create account</button></div></div></div>
<div id="toast"></div>

<script src="js/core.js"></script>
<script src="js/cloud.js"></script>
<script src="js/fallback.js"></script>
<script src="js/providers.js"></script>
<script src="js/readers.js"></script>
<script src="js/github.js"></script>
<script src="js/checks.js"></script>
<script src="js/preview.js"></script>
<script src="js/templates.js"></script>
<script src="js/repomap.js"></script>
<script src="js/skills.js"></script>
<script src="js/connectors.js"></script>
<script src="js/extras.js"></script>
<script src="js/agent-tools.js"></script>
<script src="js/agent.js"></script>
<script src="js/push.js"></script>
<script src="js/chat.js"></script>
<script src="js/native.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
